name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventario
          POSTGRES_PASSWORD: inventario
          POSTGRES_DB: inventario_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://inventario:inventario@localhost:5432/inventario_test

      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://inventario:inventario@localhost:5432/inventario_test

      - run: npm run build
        env:
          DATABASE_URL: postgresql://inventario:inventario@localhost:5432/inventario_test
