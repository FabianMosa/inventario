name: CI & Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Quality Gate for Pull Requests & Main Pushes
  test-and-lint:
    name: Lint, Test & Build Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://inventario:inventario@localhost:5432/inventario_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventario
          POSTGRES_PASSWORD: inventario
          POSTGRES_DB: inventario_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Test Suite
        run: npm run test

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations
        run: npx prisma migrate deploy

      - name: Build Next.js Production Bundle
        run: npm run build

  # Job 2: Build & Push Docker Image to Docker Hub (Runs on push/merge to main)
  docker-build-push:
    name: Build & Push Docker Image
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Usuario almacenado en GitHub Repository Secrets
          password: ${{ secrets.DOCKER_PASSWORD }}  # Token/Password almacenado en GitHub Repository Secrets

      - name: Sanitize Docker Username
        id: prep
        run: |
          # Extrae el secreto de usuario y elimina comillas, espacios y dominios de email
          RAW_USER="${{ secrets.DOCKER_USERNAME }}"
          CLEAN_USER=$(echo "$RAW_USER" | sed "s/[[:space:]\"\']//g" | tr '[:upper:]' '[:lower:]' | cut -d'@' -f1)
          
          # Valida que el nombre de usuario no esté vacío
          if [ -z "$CLEAN_USER" ]; then
            echo "::error::El secreto DOCKER_USERNAME está vacío o no está configurado en GitHub Secrets."
            exit 1
          fi
          
          # Exporta la variable sanitizada para ser usada en los siguientes pasos
          echo "username=${CLEAN_USER}" >> $GITHUB_OUTPUT

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true          # Sube la imagen compilada hacia el registro remoto de Docker Hub
          tags: ${{ steps.prep.outputs.username }}/inventario_web:v1